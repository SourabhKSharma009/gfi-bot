name: Data Lakehouse Ingestion & Partitioning Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    services:
      minio:
        image: minio/minio:latest
        ports:
          - 9000:9000
          - 9001:9001
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadminpassword
        options: >-
          --health-cmd "curl -f http://localhost:9000/minio/health/live"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        command: server /data --console-address ":9001"

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install duckdb pandas boto3

      - name: Setup MinIO Bucket
        run: |
          python -c "
          import boto3
          s3 = boto3.client('s3',
                            endpoint_url='http://127.0.0.1:9000',
                            aws_access_key_id='minioadmin',
                            aws_secret_access_key='minioadminpassword')
          try:
              s3.create_bucket(Bucket='warehouse')
              print('Bucket warehouse created!')
          except Exception as e:
              print(e)
          "

      - name: Execute Batch Ingestion
        run: python ingest.py

      - name: Execute Partitioning
        run: python partition_data.py

      - name: Validate Partition Querying
        run: python query_partitioned.py